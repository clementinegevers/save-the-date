<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the date</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ✏️  Edit everything in the CONFIG block at the bottom of this file.
   You shouldn't need to touch the CSS.
   ========================================================= */
:root{
  --paper:#E6ECF1;      /* powder blue */
  --card:#FBFBF8;
  --ink:#1F2A44;        /* deep navy */
  --soft:#5B6782;
  --blush:#E7B7AE;
  --brass:#A9813C;
  --line:#C9D3DD;
  --clue:#A26A5C;
  --velvet:#5C1A28;
  --velvet-light:#7E2A3B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141B2C; --card:#1C2438; --ink:#EEF1F6; --soft:#A9B3C8;
    --blush:#C98F86; --brass:#D2AA62; --line:#2E3850; --clue:#E0A090;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:300; line-height:1.6;
}
body.locked{overflow:hidden}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }

.script{font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive; font-weight:400}

/* ---------- Language chooser ---------- */
.splash{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px;
  background:var(--paper); text-align:center; transition:opacity .6s ease, visibility .6s;
}
.splash.hide{opacity:0; visibility:hidden}
.splash .script{font-size:clamp(3.4rem,14vw,6rem); line-height:1.1; margin:0 0 8px}
.splash p{color:var(--soft); margin:0 0 32px}
.lang-buttons{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.lang-buttons button{
  min-width:150px; padding:14px 24px; font:inherit; font-size:1.05rem; font-weight:400; cursor:pointer;
  background:var(--card); color:var(--ink); border:1px solid var(--soft); border-radius:2px;
  transition:background .2s, color .2s;
}
.lang-buttons button:hover{background:var(--ink); color:var(--card)}
.lang-buttons button:focus-visible{outline:2px solid var(--brass); outline-offset:3px}

/* Small FR · EN switch */
.lang-switch{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; z-index:10;
  display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; overflow:hidden;
}
.lang-switch button{
  font:inherit; font-size:.8rem; letter-spacing:.08em; padding:6px 12px; cursor:pointer;
  background:none; border:0; color:var(--soft);
}
.lang-switch button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.lang-switch button:focus-visible{outline:2px solid var(--brass); outline-offset:-2px}

/* ---------- Page ---------- */
.wrap{max-width:720px; margin:0 auto; padding:64px 20px 80px}
.card{
  background:var(--card); border:1px solid var(--line);
  padding:clamp(28px,6vw,64px) clamp(20px,6vw,64px);
  position:relative;
}
.card::before{ /* inner frame, like a printed invitation */
  content:""; position:absolute; inset:10px; border:1px solid var(--line); pointer-events:none;
}
section + section{margin-top:64px}

/* ---------- Hero ---------- */
.hero{text-align:center}
.kicker{font-size:1rem; letter-spacing:.06em; color:var(--soft); margin:0 0 20px}
.names{
  font-size:clamp(3rem,13vw,6.2rem); line-height:1.1; margin:0; overflow-wrap:break-word;
}
.names .amp{
  display:block; font-family:"Bodoni Moda",serif; font-style:italic; color:var(--blush);
  font-size:.5em; line-height:1; margin:.05em 0 .1em;
}
.date-big{
  font-family:"Bodoni Moda",serif; font-size:clamp(1.3rem,4vw,1.7rem);
  margin:28px 0 4px;
}
.place{color:var(--soft); margin:0}

/* ---------- Rings ---------- */
.rings{display:flex; justify-content:center; margin:36px 0 0; height:70px}
.ring{
  width:70px; height:70px; background:none; border:0; padding:0; cursor:pointer;
  color:var(--brass); transition:transform .5s cubic-bezier(.3,1.4,.5,1), opacity .5s, width .5s;
}
.ring:focus-visible{outline:2px solid var(--brass); outline-offset:4px; border-radius:50%}
.ring svg{width:100%; height:100%}
#ring2{width:0; opacity:0; transform:scale(.3)}
.rings.double #ring1{transform:translateX(10px)}
.rings.double #ring2{width:70px; opacity:1; transform:translateX(-10px) scale(1)}

/* ---------- Countdown ---------- */
.countdown{
  display:grid; grid-template-columns:repeat(4,1fr); max-width:440px; margin:0 auto;
  text-align:center;
}
.countdown div{border-left:1px solid var(--line)}
.countdown div:first-child{border-left:0}
.countdown b{display:block; font-family:"Bodoni Moda",serif; font-weight:400; font-size:clamp(1.8rem,7vw,2.6rem); line-height:1.1; font-variant-numeric:tabular-nums}
.countdown span{font-size:.85rem; color:var(--soft)}
.countdown.glitch b{color:var(--clue); filter:blur(.4px); transform:skewX(-6deg)}
.until{text-align:center; color:var(--soft); font-size:.95rem; margin:10px 0 0}

/* ---------- Story ---------- */
h2{
  font-family:"Bodoni Moda",serif; font-weight:400; font-style:italic;
  font-size:clamp(1.6rem,5vw,2.1rem); text-align:center; margin:0 0 20px;
}
.story{
  font-family:"Bodoni Moda",serif; font-size:1.12rem; line-height:1.85;
  max-width:34em; margin:0 auto; text-align:left;
}
.story p{margin:0 0 1em}
.story p::first-letter{font-size:1.6em; line-height:1; color:var(--brass); padding-right:.04em}
.story-hint{
  max-width:34em; margin:24px auto 0; padding-top:18px; border-top:1px solid var(--line);
  text-align:center; font-style:italic; color:var(--soft);
}

/* ---------- Details ---------- */
.details{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:28px 32px; text-align:center}
.details h3{font-family:"Bodoni Moda",serif; font-weight:400; font-size:1.25rem; margin:0 0 6px}
.details p{margin:0; color:var(--soft)}

/* ---------- Code ---------- */
.rsvp{text-align:center}
.rsvp p{color:var(--soft); margin:0 auto 18px; max-width:30em}
.code-row{display:flex; gap:10px; max-width:380px; margin:0 auto; flex-wrap:wrap; justify-content:center}
.code-row input{
  flex:1 1 200px; min-width:0; padding:12px 14px; font:inherit; font-size:1.05rem; letter-spacing:.15em; text-align:center;
  background:transparent; color:var(--ink); border:1px solid var(--soft); border-radius:2px; text-transform:uppercase;
}
.code-row input:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.code-row button{
  padding:12px 22px; font:inherit; font-weight:500; cursor:pointer;
  background:var(--ink); color:var(--card); border:0; border-radius:2px;
}
.code-row button:focus-visible{outline:2px solid var(--brass); outline-offset:3px}
.code-row button:disabled, .code-row input:disabled{opacity:.6; cursor:default}
.msg{min-height:1.6em; margin-top:12px; font-size:.95rem; color:var(--clue)}

/* ---------- Footer ---------- */
footer{text-align:center; margin-top:40px; color:var(--soft); font-size:.9rem}
.ps{font-size:.66rem; opacity:.55; margin-top:14px; display:inline-block}

/* ---------- Suspense stage ---------- */
.stage{
  position:fixed; inset:0; z-index:42; display:none; place-items:center; padding:24px;
  background:#0B0F1A; color:#F3EFE6; text-align:center; overflow:hidden;
}
.stage.show{display:grid; animation:fade 1s ease}
@keyframes fade{from{opacity:0}}
.stage-line{
  font-family:"Bodoni Moda",serif; font-size:clamp(1.3rem,4.5vw,2rem); min-height:1.6em; max-width:22em;
}
.stage-line::after{content:"▍"; margin-left:2px; animation:blink 1s steps(1) infinite; color:#D2AA62}
.stage-line.done::after{content:""}
@keyframes blink{50%{opacity:0}}
.chant{
  position:absolute; font-family:"Bodoni Moda",serif; font-weight:600; font-style:italic; color:#E7B7AE;
  white-space:nowrap; transform:translate(-50%,-50%); animation:chant 1.4s ease-out forwards; pointer-events:none;
}
@keyframes chant{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}
  25%{opacity:1}
  100%{opacity:0; transform:translate(-50%,-50%) scale(1.25)}
}
.count{
  font-family:"Bodoni Moda",serif; font-size:clamp(6rem,30vw,12rem); line-height:1; color:#D2AA62;
  animation:beat .9s ease-out;
}
@keyframes beat{0%{transform:scale(1.6); opacity:0} 30%{opacity:1} 100%{transform:scale(1)}}
.spotlight{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, rgba(255,236,190,.14), transparent 55%);
}

/* ---------- Reveal ---------- */
.reveal{
  position:fixed; inset:0; z-index:40; display:none; place-items:center; padding:24px;
  background:var(--ink); color:var(--card); text-align:center; overflow:auto;
}
@media (prefers-color-scheme: dark){ .reveal{background:#0F1524; color:#EEF1F6} }
.reveal.show{display:grid}
.reveal-inner{max-width:560px; padding:24px 0}
.reveal .stamp{
  display:inline-block; border:2px solid var(--blush); color:var(--blush); padding:4px 18px;
  transform:rotate(-6deg); font-size:2rem; line-height:1.3; margin-bottom:22px;
}
.photo{
  display:block; width:min(280px,70vw); aspect-ratio:4/5; object-fit:cover; margin:0 auto 24px;
  border:8px solid #FBFBF8; box-shadow:0 18px 40px rgba(0,0,0,.35); transform:rotate(2deg);
}
.reveal h2{color:inherit; font-style:normal; font-size:clamp(1.2rem,4vw,1.6rem); margin-bottom:6px}
.reveal .big{font-size:clamp(3rem,13vw,5.6rem); line-height:1.15; margin:8px 0}
.reveal .big i{font-family:"Bodoni Moda",serif; color:var(--blush); font-size:.55em}
.reveal p{max-width:30em; margin:0 auto 8px; opacity:.88}
.reveal .engaged{font-family:"Bodoni Moda",serif; font-size:1.3rem; opacity:1}
.reveal button{
  margin-top:24px; font:inherit; background:transparent; color:inherit;
  border:1px solid currentColor; padding:10px 20px; cursor:pointer; border-radius:2px;
}
.reveal button:focus-visible{outline:2px solid var(--brass); outline-offset:3px}

/* Velvet curtains that open on the reveal */
.curtain{
  position:fixed; top:0; bottom:0; width:50.5%; z-index:45; display:none;
  background:repeating-linear-gradient(90deg, var(--velvet) 0 14px, var(--velvet-light) 26px, var(--velvet) 40px);
  box-shadow:inset 0 -14px 0 #A9813C;
  transition:transform 2s cubic-bezier(.7,0,.3,1);
}
.curtain.left{left:0}
.curtain.right{right:0}
.curtain.show{display:block}
.curtain.left.open{transform:translateX(-100%)}
.curtain.right.open{transform:translateX(100%)}

#confetti{position:fixed; inset:0; z-index:50; pointer-events:none}
</style>
</head>
<body class="locked">

<!-- Language chooser -->
<div class="splash" id="splash">
  <div>
    <h1 class="script">Save the date</h1>
    <p>Choisissez votre langue · Choose your language</p>
    <div class="lang-buttons">
      <button data-lang="fr">Français</button>
      <button data-lang="en">English</button>
    </div>
  </div>
</div>

<div class="lang-switch" role="group" aria-label="Langue / Language">
  <button data-lang="fr" aria-pressed="false">FR</button>
  <button data-lang="en" aria-pressed="false">EN</button>
</div>

<div class="wrap">
  <main class="card">

    <section class="hero">
      <p class="kicker" data-t="kicker"></p>
      <h1 class="names script"><span id="n1"></span><span class="amp">&amp;</span><span id="n2"></span></h1>
      <p class="date-big" data-t="dateText"></p>
      <p class="place" data-t="place"></p>

      <div class="rings" id="rings">
        <button class="ring" id="ring1" aria-label="Ring">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="60" r="26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 33 L50 20 L60 33 Z" fill="currentColor" opacity=".8"/></svg>
        </button>
        <button class="ring" id="ring2" aria-label="Ring" tabindex="-1">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="60" r="26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 33 L50 20 L60 33 Z" fill="currentColor" opacity=".8"/></svg>
        </button>
      </div>
    </section>

    <section aria-label="Countdown">
      <div class="countdown" id="countdown">
        <div><b id="cd-d">0</b><span data-t="days"></span></div>
        <div><b id="cd-h">0</b><span data-t="hours"></span></div>
        <div><b id="cd-m">0</b><span data-t="minutes"></span></div>
        <div><b id="cd-s">0</b><span data-t="seconds"></span></div>
      </div>
      <p class="until" data-t="until"></p>
    </section>

    <section>
      <h2 data-t="storyTitle"></h2>
      <div class="story" id="story"></div>
      <p class="story-hint" data-t="storyHint"></p>
    </section>

    <section>
      <h2 data-t="detailsTitle"></h2>
      <div class="details">
        <div><h3 data-t="whenTitle"></h3><p data-t="dateText"></p></div>
        <div><h3 data-t="whereTitle"></h3><p data-t="place"></p></div>
        <div><h3 data-t="dressTitle"></h3><p data-t="dressCode"></p></div>
        <div><h3 data-t="bringTitle"></h3><p data-t="bring"></p></div>
      </div>
    </section>

    <section class="rsvp">
      <h2 data-t="codeTitle"></h2>
      <p data-t="codeIntro"></p>
      <div class="code-row">
        <input id="code" type="text" autocomplete="off" spellcheck="false">
        <button id="checkCode" data-t="codeButton"></button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </section>

  </main>

  <footer>
    <div data-t="signature"></div>
    <span class="ps" data-t="footerClue"></span>
  </footer>
</div>

<!-- Suspense stage -->
<div class="stage" id="stage" aria-live="polite">
  <div class="spotlight"></div>
  <div id="stageContent"></div>
</div>

<!-- The big reveal -->
<div class="curtain left" id="curtainL"></div>
<div class="curtain right" id="curtainR"></div>
<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle">
  <div class="reveal-inner">
    <div class="stamp script">Encore !</div>
    <img class="photo" id="photo" alt="">
    <h2 id="revealTitle" data-t="revealTitle"></h2>
    <div class="big script" id="revealNames"></div>
    <p class="engaged" data-t="revealEngaged"></p>
    <p data-t="myDateText"></p>
    <p data-t="note"></p>
    <button id="closeReveal" data-t="closeReveal"></button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   ✏️  CONFIG — edit this part only
   ========================================================= */
const CONFIG = {
  // Names and dates (same in both languages)
  sister: {
    name1: "Anne-Héloïse",
    name2: "Farhad",
    date: "2027-07-24T16:00:00"            // used by the countdown only
  },
  me: {
    name1: "Clémentine",
    name2: "Louis",
    date: ""                                // optional, e.g. "2028-06-17T15:00:00" — leave "" if no date yet
  },

  // The secret code. In BOTH languages, the first letter of each story paragraph spells it.
  secretWord: "ENCORE",

  // Your photo for the surprise page. Upload it to GitHub next to index.html with exactly this name.
  // Leave "" for no photo.
  photo: "photo.jpeg",

  text: {
    fr: {
      kicker: "Réservez la date du mariage de",
      dateText: "Samedi 24 juillet 2027",
      place: "Bruxelles, Belgique",
      days: "jours", hours: "heures", minutes: "minutes", seconds: "secondes",
      until: "avant qu’Anne-Héloïse & Farhad se disent « oui »",
      storyTitle: "Notre histoire",
      // E · N · C · O · R · E — keep each paragraph starting with the right letter
      story: [
        "Entre deux rayons d’une librairie, un mardi pluvieux, Anne-Héloïse et Farhad ont tendu la main vers le dernier exemplaire du même roman.",
        "Ni l’un ni l’autre n’a voulu le lâcher. Ils ont fini par le partager, puis un café, puis un dîner, puis les sept années suivantes.",
        "Côte à côte depuis, ils forment une vraie équipe : en vacances, en cuisine, et surtout sur un court de tennis.",
        "Où d’autre Farhad pouvait-il faire sa demande ? Sur ce même court, au printemps dernier, il a servi la question de sa vie. Anne-Héloïse a renvoyé la balle avant même qu’il ait fini : oui. Jeu, set et match.",
        "Raquettes posées, verres levés : le prochain chapitre s’écrit à Bruxelles.",
        "Entourés de tous ceux qu’ils aiment, ils ont hâte de célébrer ce grand jour avec vous."
      ],
      storyHint: "🔍 Psst… cette page regorge d’indices. Chaque paragraphe de notre histoire vous donne une lettre de votre code d’invitation.",
      detailsTitle: "Les détails",
      whenTitle: "Quand", whereTitle: "Où", dressTitle: "Tenue", bringTitle: "À apporter",
      dressCode: "Chic champêtre",
      bring: "Des mouchoirs. Prévoyez plutôt deux paquets.",
      codeTitle: "Votre code d’invitation",
      codeIntro: "Chaque invité a un code, et le vôtre se cache dans notre histoire. Saisissez-le pour confirmer que vous avez bien reçu ce save the date.",
      codePlaceholder: "Votre code",
      codeButton: "Valider",
      codeEmpty: "Saisissez d’abord votre code.",
      codeWrong1: "Ce code ne correspond pas. Relisez notre histoire, paragraphe par paragraphe.",
      codeWrong2: "Toujours pas. Indice : regardez comment commence chaque paragraphe.",
      signature: "Avec amour, la famille 💛",
      footerClue: "P.S. Cette page ne parle pas seulement d’Anne-Héloïse & Farhad.",
      tabHidden: "Psst… regardez de plus près 🔍",
      // The suspense sequence after the right code
      suspense: ["Code accepté.", "Ouverture du dossier n° 2…", "Attendez… le concert n’est pas terminé."],
      chant: "ENCORE !",
      revealTitle: "Un seul mariage, ce n’était pas assez.",
      revealEngaged: "se sont fiancés aussi !",
      myDateText: "Date à venir…",
      note: "Merci d’avoir été un si bon inspecteur 💛",
      closeReveal: "Retour au save the date",
      revealTab: "💍 Clémentine & Louis sont fiancés !"
    },
    en: {
      kicker: "Please save the date for the wedding of",
      dateText: "Saturday, July 24, 2027",
      place: "Brussels, Belgium",
      days: "days", hours: "hours", minutes: "minutes", seconds: "seconds",
      until: "until Anne-Héloïse & Farhad say “I do”",
      storyTitle: "Our story",
      // E · N · C · O · R · E — keep each paragraph starting with the right letter
      story: [
        "Every great love story needs a first scene. For Anne-Héloïse and Farhad, it was a rainy Tuesday in a bookshop, both reaching for the last copy of the same novel.",
        "Neither of them let go. They ended up sharing it, then a coffee, then a dinner, then the next seven years.",
        "Côte à côte ever since, they have become a real team: on holidays, in the kitchen, and above all on the tennis court.",
        "On that very court, last spring, Farhad served the question of his life. Anne-Héloïse returned it before he could even finish: yes. Game, set and match.",
        "Rackets down, glasses up: the next chapter begins in Brussels.",
        "Everyone they love will be there, and they can’t wait to celebrate this big day with you."
      ],
      storyHint: "🔍 Psst… this page is full of hints. Each paragraph of our story gives you one letter of your invitation code.",
      detailsTitle: "The details",
      whenTitle: "When", whereTitle: "Where", dressTitle: "Dress code", bringTitle: "What to bring",
      dressCode: "Garden formal",
      bring: "Tissues. Better make it two packs.",
      codeTitle: "Your invitation code",
      codeIntro: "Every guest has a code, and yours is hidden in our story. Enter it to confirm you’ve received this save the date.",
      codePlaceholder: "Your code",
      codeButton: "Confirm",
      codeEmpty: "Type your code first.",
      codeWrong1: "That code doesn’t match. Read our story again, paragraph by paragraph.",
      codeWrong2: "Still not it. Hint: look at how each paragraph begins.",
      signature: "With love, the family 💛",
      footerClue: "P.S. Not everything on this page is about Anne-Héloïse & Farhad.",
      tabHidden: "Psst… look closer 🔍",
      suspense: ["Code accepted.", "Opening case file no. 2…", "Wait… the concert isn’t over yet."],
      chant: "ENCORE!",
      revealTitle: "One wedding wasn’t enough.",
      revealEngaged: "are engaged too!",
      myDateText: "Date to be announced…",
      note: "Thank you for being a good inspector 💛",
      closeReveal: "Back to the save the date",
      revealTab: "💍 Clémentine & Louis are engaged!"
    }
  }
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const S = CONFIG.sister, M = CONFIG.me;
const norm = s => s.normalize("NFD").replace(/[^a-z]/gi, "").toLowerCase();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 600) : ms));
let lang = "fr", T = CONFIG.text.fr, wrong = 0;

$("n1").textContent = S.name1;
$("n2").textContent = S.name2;
$("revealNames").innerHTML = "";
$("revealNames").append(M.name1, Object.assign(document.createElement("i"), {textContent:" & "}), M.name2);

/* ---------- Photo ---------- */
if(CONFIG.photo){
  $("photo").src = CONFIG.photo;
  $("photo").alt = `${M.name1} & ${M.name2}`;
  $("photo").addEventListener("error", () => $("photo").remove());
} else $("photo").remove();

/* ---------- Language ---------- */
function setLang(l){
  if(!CONFIG.text[l]) return;
  lang = l; T = CONFIG.text[l]; wrong = 0;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t] ?? ""; });
  $("code").placeholder = T.codePlaceholder;
  $("code").setAttribute("aria-label", T.codeTitle);
  $("msg").textContent = "";
  $("story").innerHTML = "";
  T.story.forEach(text => {
    const p = document.createElement("p"); p.textContent = text; $("story").appendChild(p);
  });
  const acrostic = norm(T.story.map(t => t.trim()[0]).join(""));
  if(acrostic !== norm(CONFIG.secretWord)) console.warn(`[${l}] The story spells "${acrostic.toUpperCase()}" instead of "${CONFIG.secretWord}".`);
  document.querySelectorAll(".lang-switch button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  if(!$("reveal").classList.contains("show")) document.title = baseTitle();
  if(location.hash !== "#" + l) history.replaceState(null, "", "#" + l);
}
const baseTitle = () => `Save the date · ${S.name1} & ${S.name2}`;
function start(l){
  setLang(l);
  $("splash").classList.add("hide");
  document.body.classList.remove("locked");
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => start(b.dataset.lang)));

// A link ending in #fr or #en skips the language screen
const fromHash = location.hash.slice(1);
if(CONFIG.text[fromHash]) start(fromHash);
else { setLang("fr"); history.replaceState(null, "", location.pathname + location.search); }
addEventListener("hashchange", () => { const h = location.hash.slice(1); if(CONFIG.text[h]) setLang(h); });

/* ---------- Little hints about the second engagement ---------- */
let ringClicks = 0;
$("ring1").addEventListener("click", () => {
  if(++ringClicks >= 3){ $("rings").classList.add("double"); $("ring2").tabIndex = 0; }
});

function parts(ms){
  ms = Math.max(0, ms);
  return [Math.floor(ms/864e5), Math.floor(ms/36e5)%24, Math.floor(ms/6e4)%60, Math.floor(ms/1e3)%60];
}
let glitching = false;
function tick(){
  let target = new Date(S.date).getTime();
  if(glitching){
    if(M.date){ target = new Date(M.date).getTime(); }
    else { ["cd-d","cd-h","cd-m","cd-s"].forEach(id => $(id).textContent = "??"); return; }
  }
  const [d,h,m,s] = parts(target - Date.now());
  $("cd-d").textContent = d; $("cd-h").textContent = h; $("cd-m").textContent = m; $("cd-s").textContent = s;
}
setInterval(tick, 1000); tick();
setInterval(() => {
  glitching = true; $("countdown").classList.add("glitch"); tick();
  setTimeout(() => { glitching = false; $("countdown").classList.remove("glitch"); tick(); }, reduced ? 1500 : 700);
}, 9000);

document.addEventListener("visibilitychange", () => {
  if(!$("reveal").classList.contains("show") && !$("stage").classList.contains("show"))
    document.title = document.hidden ? T.tabHidden : baseTitle();
});

console.log("%c🔍 A detective, I see.", "font-size:16px;font-weight:bold");
console.log("This page hides more than one wedding…");

/* ---------- The code check ---------- */
let running = false;
function checkCode(){
  if(running) return;
  const val = norm($("code").value);
  if(!val){ $("msg").textContent = T.codeEmpty; return; }
  if(val === norm(CONFIG.secretWord)){ $("msg").textContent = ""; suspense(); return; }
  wrong++;
  $("msg").textContent = wrong < 2 ? T.codeWrong1 : T.codeWrong2;
}
$("checkCode").addEventListener("click", checkCode);
$("code").addEventListener("keydown", e => { if(e.key === "Enter") checkCode(); });

/* ---------- Suspense: lights down, typewriter, crowd chant, 3-2-1, curtains ---------- */
async function typeLine(text){
  const el = document.createElement("div");
  el.className = "stage-line";
  $("stageContent").replaceChildren(el);
  for(const ch of text){
    el.textContent += ch;
    await wait(reduced ? 0 : 55);
  }
  el.classList.add("done");
  await wait(1100);
}
async function chant(){
  $("stageContent").replaceChildren();
  const stage = $("stage");
  for(let i = 0; i < 12; i++){
    const c = document.createElement("div");
    c.className = "chant";
    c.textContent = T.chant;
    c.style.left = (15 + Math.random()*70) + "%";
    c.style.top = (15 + Math.random()*70) + "%";
    c.style.fontSize = (1.4 + i*0.35) + "rem";
    stage.appendChild(c);
    setTimeout(() => c.remove(), 1500);
    await wait(Math.max(130, 420 - i*28));   // the crowd gets louder and faster
  }
  await wait(900);
}
async function countdown(){
  for(const n of ["3","2","1"]){
    const el = document.createElement("div");
    el.className = "count";
    el.textContent = n;
    $("stageContent").replaceChildren(el);
    await wait(900);
  }
  $("stageContent").replaceChildren();
}
async function suspense(){
  running = true;
  $("code").disabled = true; $("checkCode").disabled = true;
  document.body.classList.add("locked");
  document.title = "…";
  $("stage").classList.add("show");
  await wait(1200);
  for(const line of T.suspense) await typeLine(line);
  await chant();
  await countdown();

  // Curtains closed, reveal behind them, then open
  $("curtainL").classList.add("show"); $("curtainR").classList.add("show");
  $("reveal").classList.add("show");
  $("stage").classList.remove("show");
  await wait(700);
  $("curtainL").classList.add("open"); $("curtainR").classList.add("open");
  document.title = T.revealTab;
  if(!reduced) setTimeout(confetti, 900);
  await wait(2000);
  $("curtainL").classList.remove("show"); $("curtainR").classList.remove("show");
  $("closeReveal").focus();
}
function closeReveal(){
  $("reveal").classList.remove("show");
  ["curtainL","curtainR"].forEach(id => $(id).classList.remove("open","show"));
  document.body.classList.remove("locked");
  $("code").disabled = false; $("checkCode").disabled = false;
  running = false;
  document.title = baseTitle();
}
$("closeReveal").addEventListener("click", closeReveal);
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("reveal").classList.contains("show")) closeReveal();
});

/* ---------- Confetti ---------- */
function confetti(){
  const c = $("confetti"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const colors = ["#E7B7AE","#D2AA62","#FBFBF8","#9DB4D0","#F3D9A4"];
  const bits = Array.from({length:200}, () => ({
    x: Math.random()*innerWidth, y: -20 - Math.random()*innerHeight*.6,
    w: 6 + Math.random()*6, h: 8 + Math.random()*8,
    vx: -1.5 + Math.random()*3, vy: 2 + Math.random()*3,
    r: Math.random()*Math.PI, vr: -.15 + Math.random()*.3,
    col: colors[Math.floor(Math.random()*colors.length)]
  }));
  const startT = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.vy += .03; b.r += b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    });
    if(t - startT < 7000) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(startT);
}
</script>
